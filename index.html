<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margin Notes — a practice notebook</title>
<meta name="description" content="A handwritten-style practice notebook for coding problems — document approaches in JavaScript or Python, walk the flow step by step, solve against tests, and diff every attempt to watch yourself improve.">
<meta property="og:title" content="Margin Notes">
<meta property="og:description" content="A practice notebook for problems, flows & the code that solves them — in JavaScript or Python.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#efe8d8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fbf7ec'/%3E%3Cline x1='13' y1='19' x2='41' y2='19' stroke='%2326211a' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M13 44c4-9 8 9 12 0c4-9 8 9 12 0c4-9 8 9 12 0' fill='none' stroke='%23c2402a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ============ the paper & the ink ============ */
:root{
  --paper:#ece4d0;
  --paper-grain:#dfd6bf;
  --sheet:#fbf7ee;
  --sheet-border:#ded4bc;
  --sheet-shadow:rgba(76,61,38,0.08);
  --ink:#231c15;
  --ink-soft:#554d3d;
  --ink-faint:#887f6d;
  --red:#c2402a;
  --green:#297746;
  --amber:#a86b16;
  --hl:#f7e06e;
  --hl-soft:rgba(247,224,110,0.45);
  --code-bg:#221d17;
  --code-ink:#ede4cc;
  --tape-bg:rgba(228,218,185,0.58);
  --tape-border:rgba(195,180,142,0.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); font-family:'Fraunces',Georgia,serif; font-size:16px; line-height:1.55;
  background-color:var(--paper);
  background-image:
    radial-gradient(var(--paper-grain) 1.15px, transparent 1.15px),
    radial-gradient(rgba(200,190,165,0.35) 1px, transparent 1px);
  background-size:24px 24px, 12px 12px;
  background-position:0 0, 12px 12px;
  min-height:100vh;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--hl);color:var(--ink)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:#cbbf9f;text-underline-offset:3px;cursor:pointer;transition:color .15s,text-decoration-color .15s}
a:hover{color:var(--red);text-decoration-color:var(--red)}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.86em;background:#f1ead7;border:1px solid #e2d9c1;padding:0 5px;border-radius:4px}
.ed-hl code,.cs-pre{background:none;border:none;padding:0;font-size:inherit;color:inherit}
button{font-family:inherit;cursor:pointer}
.flex1{flex:1}
svg.lucide{width:16px;height:16px;stroke-width:2.2;vertical-align:-2px}
button:focus-visible,a:focus-visible,.idx-row:focus-visible,.pick-row:focus-visible,.set-ink:focus-visible{outline:2px dashed var(--red);outline-offset:3px;border-radius:6px}

/* ============ masthead ============ */
.mast{max-width:1120px;margin:0 auto;padding:32px 24px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.brand{cursor:pointer;user-select:none}
.brand h1{font-family:Fraunces,serif;font-weight:650;font-size:32px;margin:0;letter-spacing:-.4px;color:var(--ink)}
.bswg{width:238px;height:8px;margin-top:1px}
.brand .sub{font-family:Caveat,cursive;font-size:19.5px;color:var(--red);margin:4px 0 0;transform:rotate(-.6deg)}
.nav{display:flex;gap:10px;align-items:center}
.nav button{background:none;border:none;font-family:Fraunces,serif;font-weight:620;font-size:15.5px;color:var(--ink-soft);padding:6px 12px 2px;position:relative;transition:color .18s}
.nav button:hover{color:var(--ink)}
.nav button .nswg{width:100%;height:7px;visibility:hidden;margin-top:1px}
.nav button.on{color:var(--ink)}
.nav button.on .nswg{visibility:visible}
.setbtn{width:40px;height:40px;border-radius:50%;border:1.6px solid #cfc4a8;background:#fffdf6;display:grid;place-items:center;color:var(--ink-soft);transition:transform .2s ease,border-color .18s,color .18s,box-shadow .18s;box-shadow:0 1px 3px rgba(87,72,44,.1)}
.setbtn:hover{border-color:var(--ink);color:var(--ink);transform:rotate(-12deg) scale(1.05);box-shadow:0 2px 5px rgba(87,72,44,.16)}
.setbtn .lucide{width:17px;height:17px}

/* ============ the sheet (a notebook page) ============ */
.sheet{
  position:relative;max-width:1080px;margin:22px auto 44px;
  background:var(--sheet);
  border:1px solid var(--sheet-border);
  border-radius:4px;
  box-shadow:
    0 1px 2px rgba(45,35,20,.05),
    0 8px 24px var(--sheet-shadow),
    5px 8px 0 rgba(87,72,44,.07),
    inset 0 1px 0 rgba(255,255,255,.8);
  animation:pagein .45s cubic-bezier(.16,1,.3,1) both;
}
@keyframes pagein{from{opacity:0;transform:translateY(14px) rotate(-.3deg)}to{opacity:1;transform:none}}
.sheet::before{
  content:'';position:absolute;top:0;bottom:0;left:74px;width:1.5px;
  background:var(--red);opacity:.35;
  box-shadow:1px 0 0 rgba(255,255,255,.4);
}
.pageno{position:absolute;left:44px;top:42px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:Caveat,cursive;font-size:18px;color:var(--red);user-select:none}
.page{padding:44px 52px 54px 110px}

/* ============ problem page ============ */
.p-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.crumbs{font-family:Caveat,cursive;font-size:20px;color:var(--ink-soft);cursor:pointer;display:flex;gap:6px;align-items:center;width:fit-content}
.crumbs:hover{color:var(--red)}
.crumbs .lucide{width:15px;height:15px}
.p-actions{display:flex;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:Fraunces,serif;font-weight:620;font-size:14px;
  padding:9px 17px;border-radius:11px;
  border:1.6px solid var(--ink);background:var(--ink);color:#f7f1e2;
  box-shadow:2px 3px 0 rgba(87,72,44,.2);
  transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease;
  user-select:none;
}
.btn:hover{transform:translateY(-1.5px);box-shadow:2px 4.5px 0 rgba(87,72,44,.25)}
.btn:active{transform:translateY(1px);box-shadow:1px 1px 0 rgba(87,72,44,.2)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:#cfc4a8}
.btn.ghost:hover{border-color:var(--ink);background:rgba(255,253,246,.85);box-shadow:1px 2px 0 rgba(87,72,44,.1)}
.btn.red{background:var(--red);border-color:var(--red);color:#fffdf8}
.btn.red:hover{background:#b03521;border-color:#b03521}
.btn.danger{background:transparent;color:#c2402a;border-color:#c2402a;box-shadow:none}
.btn.danger:hover{background:rgba(194,64,42,.08)}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.btn.xs{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn .lucide{width:15px;height:15px}
.p-title{font-family:Fraunces,serif;font-weight:640;font-size:36px;line-height:1.06;margin:4px 0 2px;display:inline-block;max-width:100%;letter-spacing:-.4px}
.p-title .tswg{width:100%;height:9px;margin-top:3px}
.p-title.sm{font-size:25px}
.p-sub{display:flex;gap:12px;align-items:center;margin:8px 0 16px;color:var(--ink-faint);font-size:14px;flex-wrap:wrap}
.ptags{font-family:Caveat,cursive;font-size:17.5px}
.langchip{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.4px;color:var(--ink-soft);border:1.5px solid #cfc4a8;background:#fffdf6;padding:2px 8px 3px;border-radius:6px;box-shadow:0 1px 2px rgba(87,72,44,.05)}
.statement{font-size:17.5px;line-height:1.72;max-width:76ch;margin:12px 0 4px}
.statement::first-letter{float:left;font-size:46px;line-height:.82;padding:6px 9px 0 0;color:var(--red);font-weight:640}

/* stamps */
.stamp{
  display:inline-block;font-family:Caveat,cursive;font-weight:700;font-size:16.5px;
  padding:1px 11px 3px;border:2px solid currentColor;
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  transform:rotate(-2deg);
  text-shadow:0 0 0.5px currentColor;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
  transition:transform .2s ease;
}
.stamp:hover{transform:rotate(0deg) scale(1.04)}
.stamp.easy{color:var(--green);border-color:var(--green)}
.stamp.medium{color:var(--amber);border-color:var(--amber)}
.stamp.hard{color:#c2402a;border-color:#c2402a}
.stamp.sm{font-size:13px;padding:0 7px 1px;border-width:1.5px}
.cstamp{
  display:inline-block;font-family:Caveat,cursive;font-weight:700;font-size:15px;color:var(--ink-soft);
  border:2px solid #9a9075;padding:1px 10px 3px;
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  transform:rotate(-1.2deg);
}
.cstamp.s2{transform:rotate(1.4deg)}
.stamps{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}

/* given -> return */
.gr-wrap{margin:24px 0}
.gr-wrap .cap{font-family:Caveat,cursive;font-size:16.5px;color:var(--ink-faint);margin-bottom:6px}
.gr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gr-item{border:1.6px solid #cfc4a8;background:#fffdf6;padding:10px 16px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;font-style:italic;font-size:15.5px;max-width:420px;color:var(--ink);box-shadow:0 1px 3px rgba(87,72,44,.06)}
.gr-label{font-family:Caveat,cursive;font-weight:700;font-size:18px;color:var(--red);font-style:normal;margin-right:8px}
.gr-arr{color:var(--ink-soft);flex:0 0 auto}

/* summary box (taped note) */
.summary{position:relative;background:#fdf6da;border:1.6px solid #d9cf9e;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:18px 24px 20px;margin:32px 0 10px;box-shadow:1px 2px 4px rgba(87,72,44,.08)}
.summary h3{font-family:Caveat,cursive;font-size:25px;margin:0;position:relative;display:inline-block;z-index:1}
.summary h3::before{content:'';position:absolute;left:-5px;right:-7px;top:26%;bottom:6%;background:var(--hl);opacity:.7;z-index:-1;transform:skewX(-8deg) rotate(-.5deg)}
.summary p{font-size:15.5px;line-height:1.68;color:var(--ink);margin:8px 0 0;max-width:78ch}
.tape{
  position:absolute;width:78px;height:22px;
  background:var(--tape-bg);
  border:1px solid var(--tape-border);
  box-shadow:0 1px 3px rgba(87,72,44,.12);
  backdrop-filter:blur(1px);
  -webkit-backdrop-filter:blur(1px);
  clip-path:polygon(0% 3px, 3px 0%, calc(100% - 3px) 0%, 100% 3px, 98% 8px, 100% 13px, 97% 18px, 100% 22px, calc(100% - 3px) 22px, 3px 22px, 0% 19px, 3% 14px, 0% 9px);
  pointer-events:none;
  z-index:2;
}
.summary .tape.t1{top:-12px;left:34px;transform:rotate(-5deg)}
.summary .tape.t2{top:-12px;right:34px;transform:rotate(3.5deg)}

/* section headers */
.sec{display:flex;align-items:center;gap:12px;margin:46px 0 8px;font-family:Fraunces,serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft)}
.sec .sec-swg{width:64px;height:8px}
.marg{font-family:Caveat,cursive;font-size:20px;color:var(--ink-soft);line-height:1.35;margin:10px 0}
.marg.sm{font-size:17px}
.marg.big{font-size:23px;color:var(--red)}
.marg a{color:var(--red);text-decoration:underline dotted;text-underline-offset:3px}

/* approaches */
.approach{margin:38px 0 12px}
.approach:not(:first-child)::before{content:'· · ·';display:block;text-align:center;letter-spacing:14px;color:#c2b595;font-size:18px;margin:34px 0 30px}
.ap-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ap-no{font-family:Caveat,cursive;font-size:25px;color:var(--red);font-weight:700}
.ap-name{font-family:Fraunces,serif;font-size:20px;font-weight:640}
.ap-idea{font-size:15.5px;color:var(--ink-soft);line-height:1.68;max-width:78ch;margin:10px 0 4px}

/* the taped-in code sheet */
.code-sheet{position:relative;margin:22px 0 8px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:18px 14px 14px 8px;transform:rotate(-.35deg);box-shadow:3px 5px 0 rgba(87,72,44,.16), 0 4px 12px rgba(40,30,15,.12);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13.5px;line-height:22px;overflow-x:auto}
.code-sheet .tape.t1{top:-11px;left:26px;transform:rotate(-4deg)}
.code-sheet .tape.t2{top:-11px;right:26px;transform:rotate(3deg)}
.cl{white-space:pre;border-radius:4px;padding:0 8px;min-height:22px;transition:background .25s, box-shadow .25s}
.cl .ln{color:#6b6450;user-select:none;display:inline-block;width:3ch;margin-right:14px;text-align:right}
.cl.hot{background:rgba(246,223,107,.14);box-shadow:inset 0 0 0 1px rgba(246,223,107,.3)}
.tk-k{color:#e08a72}.tk-s{color:#a7c08a}.tk-n{color:#d9a558}.tk-c{color:#7a7360;font-style:italic}.tk-f{color:#d8c58a}
.cs-pre{white-space:pre}

/* flow walkthrough */
.flow{margin:14px 0 4px}
.flow-rail{display:flex;align-items:flex-start;gap:2px;overflow-x:auto;padding:10px 14px 14px;scrollbar-width:thin}
.flow-rail::-webkit-scrollbar{height:8px}
.flow-rail::-webkit-scrollbar-thumb{background:#cfc4a8;border-radius:8px}
.fstep{flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.fchip{position:relative;background:#fffdf6;border:1.6px solid #c9bda0;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:7px 14px 8px;font-family:Fraunces,serif;font-weight:620;font-size:14px;color:var(--ink-soft);transition:all .2s;box-shadow:0 1px 2px rgba(87,72,44,.06)}
.fchip .q{color:var(--red);margin-right:5px;font-weight:700}
.fstep.done .fchip{color:var(--ink);border-color:#a89b78;background:#fbf7ec}
.fstep.act .fchip{color:var(--ink);background:#fff;border-color:var(--ink-soft);box-shadow:0 2px 6px rgba(87,72,44,.12)}
.fbr{display:flex;gap:12px;margin-top:6px;font-family:Caveat,cursive;font-size:14.5px;color:var(--ink-faint)}
.fbr .yes{color:var(--green)}.fbr .no{color:var(--amber)}
.farrow{flex:0 0 52px;width:52px;height:26px;margin-top:4px;color:#c6ba9e}
.scribble{position:absolute;inset:-7px -9px;width:calc(100% + 18px);height:calc(100% + 14px);pointer-events:none;overflow:visible}
.flow-nar{display:flex;align-items:flex-start;gap:8px;font-family:Caveat,cursive;font-size:20px;color:var(--ink);min-height:34px;margin-top:2px}
.flow-nar .lucide{width:15px;height:15px;color:var(--red);margin-top:5px;flex:0 0 auto}
.flow-ctl{display:flex;gap:8px;margin-top:4px;align-items:center;flex-wrap:wrap}
.fbtn{width:34px;height:34px;border-radius:50%;border:1.6px solid #c9bda0;background:#fffdf6;display:grid;place-items:center;color:var(--ink-soft);transition:border-color .15s,color .15s,transform .15s}
.fbtn:hover{border-color:var(--ink);color:var(--ink);transform:scale(1.08)}
.fbtn .lucide{width:15px;height:15px}
.fbtn.main{width:auto;padding:0 15px;border-radius:999px;font-family:Fraunces,serif;font-weight:620;font-size:13px;display:flex;align-items:center;gap:7px}
.flow .ic-play,.flow .ic-pause{width:14px;height:14px}
.flow:not(.playing) .ic-pause{display:none}
.flow.playing .ic-play{display:none}
.flow-pos{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);margin-left:8px}

/* try-it box */
.try{margin-top:16px;border-top:1.5px dashed #d5cab0;padding-top:14px}
.try-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.try-lbl{font-family:Caveat,cursive;font-size:20px;color:var(--red);font-weight:700}
.sel{font-family:Fraunces,serif;background:#fffdf6;border:1.5px solid #c9bda0;border-radius:9px;padding:7px 10px;font-size:14px;color:var(--ink);box-shadow:0 1px 2px rgba(87,72,44,.05)}
.try-note{font-size:12.5px;color:var(--ink-faint)}
.try-json{width:100%;min-height:72px;font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#fffdf6;border:1.5px solid #c9bda0;border-radius:9px;padding:10px;margin-top:10px;resize:vertical}
.try-out{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--code-bg);color:var(--code-ink);border-radius:9px;padding:13px 15px;box-shadow:0 2px 8px rgba(40,30,15,.12)}
.vline{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:13px}
.vline .lucide{width:15px;height:15px}
.vline.ok{color:#a5c98b}.vline.bad{color:#e08a72}.vline.ok2{color:var(--code-ink)}
.err{color:#e08a72}
.logs{margin-top:8px;border-top:1px dashed #4a4436;padding-top:8px}
.logln{color:#b5ab90;padding:1px 0;font-size:12.5px;white-space:pre-wrap}
.runmsg{color:#b5ab90;font-family:Caveat,cursive;font-size:18px}

/* scratchpad */
.pad-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tool{width:34px;height:34px;border-radius:50%;border:1.6px solid #c9bda0;background:#fffdf6;display:grid;place-items:center;color:var(--ink-soft);transition:all .15s}
.tool:hover{border-color:var(--ink);color:var(--ink);transform:scale(1.08)}
.tool.on{border-color:var(--red);color:var(--ink);background:#fff;box-shadow:0 0 0 2px rgba(194,64,42,.15)}
.tool.red{color:var(--red)}
.tool .lucide{width:16px;height:16px}
.pad-sep{flex:0 0 2px;height:22px;background:#d8cdb2;margin:0 4px}
.pad-hint{font-family:Caveat,cursive;font-size:15.5px;color:var(--ink-faint);margin-left:auto}
.pad-wrap{border:1.6px solid #c9bda0;border-radius:12px;background:#fffdf6;background-image:radial-gradient(#e6ddc4 1px,transparent 1px);background-size:18px 18px;box-shadow:inset 0 1px 3px rgba(87,72,44,.06)}
.pad-c{display:block;width:100%;aspect-ratio:2/1;cursor:crosshair;touch-action:none}

/* attempts & diff */
.stats-line{font-family:Caveat,cursive;font-size:20px;color:var(--red);margin:6px 0 16px;transform:rotate(-.4deg)}
.att-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.att-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.att-pick .f-lbl{margin:0}
.att-vs{font-family:Caveat,cursive;font-size:16px;color:var(--ink-faint)}
.spark-wrap{display:flex;flex-direction:column;margin-left:auto}
.spark-lbl{font-family:Caveat,cursive;font-size:14px;color:var(--ink-faint);text-align:right}
.att-list{list-style:none;padding:0;margin:8px 0}
.att-row{display:flex;gap:16px;align-items:baseline;padding:8px 2px;border-bottom:1px dashed #ddd2b8;font-size:14px;flex-wrap:wrap}
.att-no{font-family:Caveat,cursive;color:var(--red);font-weight:700;font-size:17px;flex:0 0 34px}
.att-when{color:var(--ink-faint);font-size:13px;flex:0 0 90px}
.att-dur{font-family:'JetBrains Mono',monospace;font-size:13px;flex:0 0 56px}
.att-lines{color:var(--ink-faint);font-size:13px;flex:0 0 70px}
.att-flag{font-family:Caveat,cursive;font-size:15px}
.att-flag.ok{color:var(--green)}.att-flag.bad{color:#c2402a}.att-flag.warn{color:var(--amber)}
.dstat{font-family:Caveat,cursive;font-size:18px;color:var(--red);margin:12px 0 2px}
.dsub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);margin:2px 0 8px}
.diff{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.8px;border:1.5px solid #d8cdb2;border-radius:9px;overflow-x:auto;margin-top:6px;background:#fffdf6;box-shadow:0 1px 3px rgba(87,72,44,.06)}
.dl{display:flex;line-height:21px;min-height:21px}
.dl .m{flex:0 0 30px;text-align:center;color:var(--ink-faint);border-right:1px solid #e6dcbf;user-select:none}
.dl .c{padding:0 10px;white-space:pre;flex:1}

<main id="app"></main>

<script>
/* =========================================================
   Margin Notes — a handwritten-style practice notebook
   runs JavaScript and Python, all in the browser
   ========================================================= */

/* ---------- tiny helpers ---------- */
const $  = (s, r=document)=>r.querySelector(s);
const $$ = (s, r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (n=2)=>+(Math.random()*2*n-n).toFixed(1);
const icons = ()=>{ try{ window.lucide && lucide.createIcons(); }catch(e){} };
const fmtVal = v => { if(v===undefined) return 'undefined'; if(typeof v==='string') return JSON.stringify(v); try{ return JSON.stringify(v); }catch(e){ return String(v); } };
const langName = l => l==='py' ? 'Python' : 'JavaScript';
function fmtDur(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  return h? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; }
function fmtAgo(ts){ const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago'; if(s<604800)return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function deepEqual(a,b){
  if(a===b) return true;
  if(typeof a!=='object'||typeof b!=='object'||a===null||b===null) return Number.isNaN(a)&&Number.isNaN(b);
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  const ka=Object.keys(a), kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  return ka.every(k=>deepEqual(a[k],b[k]));
}

/* ---------- hand-drawn SVG builders ---------- */
const NS='http://www.w3.org/2000/svg';
function roughLine(x1,y1,x2,y2,seg=3,j=2){
  let d=`M ${+(x1+rnd(j*.5)).toFixed(1)} ${+(y1+rnd(j*.5)).toFixed(1)}`;
  for(let k=1;k<seg;k++){ const t=k/seg;
    d+=` L ${+(x1+(x2-x1)*t+rnd(j)).toFixed(1)} ${+(y1+(y2-y1)*t+rnd(j)).toFixed(1)}`; }
  d+=` L ${x2} ${y2}`;
  return d;
}
function svgArrowH(cls){
  const d=roughLine(4,13,44,13)+` M 44 13 L ${33+rnd(2)} ${6+rnd(2)} M 44 13 L ${32+rnd(2)} ${19+rnd(2)}`;
  return `<svg class="${cls}" width="52" height="26" viewBox="0 0 52 26" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function squiggleD(w=300,h=9){
  let d=`M 2 ${(h/2).toFixed(1)}`, x=2;
  while(x<w-6){ const nx=x+9;
    d+=` Q ${(x+nx)/2} ${+(h/2+rnd(3)).toFixed(1)} ${nx} ${+(h/2+rnd(1.2)).toFixed(1)}`; x=nx; }
  return d;
}
function svgSquiggle(w=300,h=9,cls='swg'){
  return `<svg class="${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${squiggleD(w,h)}" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round" opacity=".8"/></svg>`;
}
function checkPathD(){ return roughLine(14,50,48,72,3,2.5)+' '+roughLine(48,72,104,16,3,2.5); }
function scribblePathD(w,h){
  const cx=w/2, cy=h/2, rx=Math.max(6,w/2-8), ry=Math.max(4,h/2-8);
  const pt=(deg,j=2)=>{ const a=deg*Math.PI/180;
    return [+(cx+Math.cos(a)*rx+rnd(j)).toFixed(1), +(cy+Math.sin(a)*ry+rnd(j)).toFixed(1)]; };
  const p0=pt(-80);
  let d=`M ${p0[0]} ${p0[1]}`;
  for(let a=-50;a<=-80+684;a+=30){
    const c=pt(a-15,3), e=pt(a,2.5);
    d+=` Q ${c[0]} ${c[1]} ${e[0]} ${e[1]}`;
  }
  return d;
}
function addScribble(chip){
  const w=chip.offsetWidth, h=chip.offsetHeight;
  if(!w||!h) return;
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','scribble');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',scribblePathD(w,h));
  path.setAttribute('fill','none'); path.setAttribute('stroke','var(--red)');
  path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round');
  svg.appendChild(path); chip.appendChild(svg);
  const L=path.getTotalLength();
  path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
  requestAnimationFrame(()=>{ path.style.transition='stroke-dashoffset .5s ease'; path.style.strokeDashoffset='0'; });
}
function sparkSVG(atts){
  const vals=atts.map(a=>a.duration), w=210,h=44,pad=8;
  if(vals.length<2) return '';
  const max=Math.max(...vals), min=Math.min(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>[+(pad+i*(w-2*pad)/(vals.length-1)).toFixed(1), +(h-pad-((v-min)/span)*(h-2*pad-6)+rnd(1.5)).toFixed(1)]);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  pts.slice(1).forEach(p=>{ d+=` L ${p[0]} ${+ (p[1]+rnd(1.5)).toFixed(1)}`; });
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--red)"/>`).join('');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>${dots}</svg>`;
}

/* ---------- pen-colored syntax highlighter (js + python) ---------- */
const KJ=new Set('const let var function return if else for while do of in new class extends break continue typeof true false null undefined switch case default try catch throw async await'.split(' '));
const KP=new Set('def return if elif else for while in not and or is None True False import from as with try except finally raise lambda pass break continue class global nonlocal yield del assert match case async await'.split(' '));
function hl(code,lang='js'){
  const cm = lang==='py' ? /#[^\n]*/.source
                          : /\/\/[^\n]*|\/\*[\s\S]*?\*\//.source;
  const st = lang==='py'
    ? /'''[\s\S]*?'''|"""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/.source
    : /`(?:[^`\\]|\\.)*`|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"/.source;
  const re=new RegExp(`(${cm})|(${st})|(\\b\\d[\\d_]*(?:\\.\\d+)?\\b)|([A-Za-z_$][\\w$]*)`,'g');
  const KW = lang==='py' ? KP : KJ;
  let out='', last=0, m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const full=m[0];
    if(m[1]) out+=`<span class="tk-c">${esc(full)}</span>`;
    else if(m[2]) out+=`<span class="tk-s">${esc(full)}</span>`;
    else if(m[3]) out+=`<span class="tk-n">${esc(full)}</span>`;
    else if(KW.has(full)) out+=`<span class="tk-k">${esc(full)}</span>`;
    else if(code[m.index+full.length]==='(') out+=`<span class="tk-f">${esc(full)}</span>`;
    else out+=esc(full);
    last=m.index+full.length;
  }
  out+=esc(code.slice(last));
  return out;
}

/* ---------- line diff (LCS) ---------- */
function diffOps(a,b){
  const A=a.split('\n'), B=b.split('\n'), m=A.length, n=B.length;
  const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<m&&j<n){
    if(A[i]===B[j]){ops.push({t:'=',s:A[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:'-',s:A[i]});i++;}
    else{ops.push({t:'+',s:B[j]});j++;}
  }
  while(i<m){ops.push({t:'-',s:A[i++]});}
  while(j<n){ops.push({t:'+',s:B[j++]});}
  return ops;
}
function diffHTML(a,b){
  const ops=diffOps(a,b);
  let add=0,rem=0,eq=0;
  ops.forEach(o=>{ o.t==='+'?add++ : o.t==='-'?rem++ : eq++; });
  const sim=Math.round(eq/Math.max(1,a.split('\n').length,b.split('\n').length)*100);
  const rowOf=o=>`<div class="dl ${o.t==='='?'':o.t}"><span class="m">${o.t==='='?'':o.t==='-'?'−':'+'}</span><span class="c">${esc(o.s)||' '}</span></div>`;
  const rows=[]; let run=[];
  const flush=()=>{
    if(!run.length) return;
    if(run.length>8){ rows.push(...run.slice(0,3).map(rowOf), `<div class="dl sep">··· ${run.length-6} unchanged lines ···</div>`, ...run.slice(-3).map(rowOf)); }
    else rows.push(...run.map(rowOf));
    run=[];
  };
  ops.forEach(o=>{ if(o.t==='=') run.push(o); else { flush(); rows.push(rowOf(o)); } });
  flush();
  return { html:`<div class="diff">${rows.join('')}</div>`,
           stat:`${add} line${add!==1?'s':''} added · ${rem} removed · ${sim}% identical` };
}

/* =========================================================
   code runners
   · JavaScript: sandboxed web worker, 3s guard
   · Python: Pyodide (WASM CPython) in a worker, lazy-loaded
     from CDN on the first Python run, with a 60s watchdog
   ========================================================= */
function runSync(code,input){
  const logs=[];
  const fmt=v=>{ if(typeof v==='string')return v; try{return JSON.stringify(v)}catch(e){return String(v)} };
  const cons={log:(...a)=>logs.push(a.map(fmt).join(' ')), warn:(...a)=>logs.push('[warn] '+a.map(fmt).join(' ')), error:(...a)=>logs.push('[err] '+a.map(fmt).join(' '))};
  let result, err=null; const t0=performance.now();
  try{ result=new Function('input','console',code)(input,cons); }catch(ex){ err=String((ex&&ex.message)||ex); }
  return {result,err,logs,ms:Math.max(1,Math.round(performance.now()-t0))};
}
function runJS(code,input){
  return new Promise(resolve=>{
    let w;
    try{
      const src=`self.onmessage=function(e){
        var logs=[];
        function fmt(v){ if(typeof v==='string')return v; try{return JSON.stringify(v)}catch(_){return String(v)} }
        var cons={log:function(){logs.push(Array.prototype.map.call(arguments,fmt).join(' '))},
                  warn:function(){logs.push('[warn] '+Array.prototype.map.call(arguments,fmt).join(' '))},
                  error:function(){logs.push('[err] '+Array.prototype.map.call(arguments,fmt).join(' '))}};
        var result,err=null,t0=Date.now();
        try{ result=new Function('input','console',${JSON.stringify(code)})(e.data.input,cons); }
        catch(ex){ err=String((ex&&ex.message)||ex); }
        var out;
        try{ out=(result===undefined)?undefined:JSON.parse(JSON.stringify(result)); }catch(_){ out=String(result); }
        self.postMessage({result:out,err:err,logs:logs,ms:Date.now()-t0});
      };`;
      w=new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));
    }catch(e){ resolve(runSync(code,input)); return; }
    const to=setTimeout(()=>{ w.terminate(); resolve({timeout:true}); },3000);
    w.onmessage=ev=>{ clearTimeout(to); resolve(ev.data); try{w.terminate();}catch(e){} };
    w.onerror=ev=>{ clearTimeout(to); try{w.terminate();}catch(e){} resolve({err:(ev&&ev.message)||'worker error'}); };
    w.postMessage({input});
  });
}

/* --- python: pyodide worker, created on demand --- */
const PY_BASE='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const PY={w:null,ready:false,cur:null,watch:null,queue:[]};
function pyWorkerSrc(){
  return `
importScripts('${PY_BASE}pyodide.js');
let pyodide=null, booting=null;
function boot(){
  if(pyodide) return Promise.resolve(pyodide);
  if(!booting) booting = loadPyodide({indexURL:'${PY_BASE}'}).then(function(p){ pyodide=p; self.postMessage({type:'ready'}); return p; });
  return booting;
}
self.onmessage = async function(e){
  if(!e.data || e.data.type!=='run') return;
  try{ await boot(); }
  catch(err){ self.postMessage({type:'run-done', result:{err:'could not load the Python runtime — check the connection'}}); return; }
  const t0=Date.now();
  let out=null;
  try{ out = await pyodide.runPythonAsync(e.data.code); }
  catch(err){ self.postMessage({type:'run-done', result:{err:String((err&&err.message)||err), ms:Math.max(1,Date.now()-t0)}}); return; }
  let res;
  try{ res = JSON.parse(out); }
  catch(_){ res = {err:'internal: unreadable Python result'}; }
  res.ms = Math.max(1, Date.now()-t0);
  self.postMessage({type:'run-done', result:res});
};`;
}
/* user code is indented into a function, so a top-level
   `return` works exactly like the JS runner — and `input`
   arrives as a plain dict parsed from the test's JSON */
function buildPyWrapper(code,input){
  const body=String(code).replace(/\t/g,'    ').split('\n')
    .map(l=>/^\s*$/.test(l)?'':'    '+l).join('\n');
  const inLit=JSON.stringify(JSON.stringify(input??{}));
  return [
    'import json, sys, io, traceback',
    'def __mn_run():',
    '    _buf = io.StringIO()',
    '    _old = sys.stdout',
    '    sys.stdout = _buf',
    '    _in = json.loads('+inLit+')',
    '    _res = {"result": None, "err": None}',
    '    def __mn_solve(input):',
    body,
    '        pass',
    '    try:',
    '        _res["result"] = __mn_solve(_in)',
    '    except SystemExit:',
    '        pass',
    '    except BaseException:',
    '        _res["err"] = traceback.format_exc().strip().splitlines()[-1]',
    '    sys.stdout = _old',
    '    _res["logs"] = _buf.getvalue()',
    '    return json.dumps(_res, default=str)',
    '__mn_run()'
  ].join('\n');
}
function runPython(wrapper){
  return new Promise(resolve=>{ PY.queue.push({wrapper,resolve}); pyPump(); });
}
function pyPump(){
  if(PY.cur||!PY.queue.length) return;
  const job=PY.queue.shift();
  if(!PY.w){
    try{
      PY.w=new Worker(URL.createObjectURL(new Blob([pyWorkerSrc()],{type:'text/javascript'})));
      PY.w.onmessage=ev=>{
        const d=ev.data||{};
        if(d.type==='ready'){ PY.ready=true; return; }
        if(d.type==='run-done'&&PY.cur){
          clearTimeout(PY.watch);
          const res=d.result||{};
          if(typeof res.logs==='string') res.logs=res.logs.split('\n').filter(x=>x!=='');
          else if(!Array.isArray(res.logs)) res.logs=[];
          const fin=PY.cur; PY.cur=null;
          fin.resolve(res);
          pyPump();
        }
      };
      PY.w.onerror=()=>{
        clearTimeout(PY.watch);
        try{ PY.w&&PY.w.terminate(); }catch(_){}
        PY.w=null; PY.ready=false;
        if(PY.cur){ const fin=PY.cur; PY.cur=null; fin.resolve({err:'the Python runtime failed to load — check the connection'}); }
        pyPump();
      };
    }catch(e){ job.resolve({err:'could not start the Python runtime'}); return; }
  }
  PY.cur=job;
  PY.watch=setTimeout(()=>{
    try{ PY.w&&PY.w.terminate(); }catch(_){}
    PY.w=null; PY.ready=false;
    if(PY.cur){ const fin=PY.cur; PY.cur=null; fin.resolve({timeout:true}); }
    pyPump();
  },60000);
  PY.w.postMessage({type:'run',code:job.wrapper});
}
function runCode(code,input,lang='js'){
  if(lang==='py') return runPython(buildPyWrapper(code,input));
  return runJS(code,input);
}
const pyLoadMsg = () => (PY.ready? 'running…' : 'loading the Python runtime — one-time download (~10 MB), then it’s cached…');

const LS_KEY='margin-notes-v2';
const store={
  problems:[],
  load(){ try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        this.problems=JSON.parse(raw);
        this.problems.forEach(p=>{ if(!p.lang) p.lang='js'; });
      } else {
        const old=localStorage.getItem('margin-notes-v1');
        if(old){
          this.problems=JSON.parse(old);
          this.problems.forEach(p=>{ if(!p.lang) p.lang='js'; });
          this.save(); localStorage.removeItem('margin-notes-v1');
        } else { this.problems=seed(); this.save(); }
      }
    }catch(e){ this.problems=seed(); } },
  save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(this.problems)); }catch(e){} },
  byId(id){ return this.problems.find(p=>p.id===id); },
  upsert(p){ const i=this.problems.findIndex(x=>x.id===p.id); if(i>=0) this.problems[i]=p; else this.problems.push(p); },
  remove(id){ this.problems=this.problems.filter(p=>p.id!==id); }
};

    w=Math.max(min,Math.min(max,Math.round(w)));

    swg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    swg.style.width=w+'px';
    const p=swg.querySelector('path'); if(p) p.setAttribute('d',squiggleD(w,h));
  };
  fit($('.brand .bnm'), $('.brand .bswg'));
  fit($('.lib-title span'), $('.lib-head .lswg'));
  $$('.p-title span').forEach(el=>{
    const pTitle = el.closest('.p-title');
    if(pTitle) fit(el, pTitle.querySelector('.tswg'), 100, 600);
  });
}

function statbarHTML(){

/* ---------- problem page mounts ---------- */
function mountProblem(){
  const p=curProblem(); if(!p) return;
  p.approaches.forEach((a,ai)=>{
    if(a.steps&&a.steps.length) mountFlow(p,ai);
    mountTry(p,ai);
  });
  mountPad(p);
  mountAttempts(p);
  const ga=document.querySelector('.gr-arr path');
  if(ga){
    const L=ga.getTotalLength();
    ga.style.strokeDasharray=L; ga.style.strokeDashoffset=L;
    requestAnimationFrame(()=>{ ga.style.transition='stroke-dashoffset .7s ease .25s'; ga.style.strokeDashoffset='0'; });
  }
}
function mountFlow(p,ai){
  const root=document.querySelector(`[data-flow="${ai}"]`); if(!root) return;
  const steps=p.approaches[ai].steps;
  const chips=$$('.fstep',root);
  const arrows=$$('.farrow path',root);
  arrows.forEach(pa=>{
    const L=pa.getTotalLength();
    pa.dataset.len=L; pa.dataset.on='';
    pa.style.strokeDasharray=L; pa.style.strokeDashoffset='0'; pa.style.stroke='#c6ba9e';
  });
  chips.forEach((c,k)=>{
    c.style.cursor='pointer';
    c.addEventListener('click',()=>setStep(ai,k));
  });
  const codeSheet=document.querySelector(`[data-code="${ai}"]`);
  FLOW[ai]={i:-1,steps,chips,arrows,codeSheet,root,timer:null};
  $$('.fbtn',root).forEach(b=>b.addEventListener('click',()=>flowAct(ai,b.dataset.act)));
  setStep(ai,0);
}
function flowAct(ai,act){
  const F=FLOW[ai]; if(!F) return;
  if(act==='next') setStep(ai,F.i+1);
  else if(act==='prev') setStep(ai,F.i-1);
  else if(act==='reset'){ stopPlay(ai); setStep(ai,0); }
  else if(act==='play'){ F.root.classList.contains('playing')? stopPlay(ai) : startPlay(ai); }
}
function startPlay(ai){
  const F=FLOW[ai]; if(!F) return;
  if(F.i>=F.steps.length-1) setStep(ai,0);
  F.root.classList.add('playing');
  const l=F.root.querySelector('.playlbl'); if(l) l.textContent='pause';
  F.timer=setInterval(()=>{
    if(F.i>=F.steps.length-1){ stopPlay(ai); return; }
    setStep(ai,F.i+1);
  },1600);
}
function stopPlay(ai){
  const F=FLOW[ai]; if(!F) return;
  clearInterval(F.timer); F.timer=null;
  F.root.classList.remove('playing');
  const l=F.root.querySelector('.playlbl');
  if(l) l.textContent=(F.i>=F.steps.length-1)?'replay':'walk through';
}
function setStep(ai,i){
  const F=FLOW[ai]; if(!F) return;
  i=Math.max(0,Math.min(F.steps.length-1,i)); F.i=i;
  F.chips.forEach((c,k)=>{ c.classList.toggle('done',k<i); c.classList.toggle('act',k===i); });
  $$('.scribble',F.root).forEach(s=>s.remove());
  addScribble($('.fchip',F.chips[i]));
  F.arrows.forEach((pa,k)=>{
    const on=k<i, was=pa.dataset.on==='1';
    if(on&&!was){
      pa.dataset.on='1';
      pa.style.transition='none'; pa.style.stroke='var(--red)';
      pa.style.strokeDashoffset=pa.dataset.len;
      pa.getBoundingClientRect();
      pa.style.transition='stroke-dashoffset .4s ease';
      pa.style.strokeDashoffset='0';
    } else if(!on&&was){
      pa.dataset.on=''; pa.style.stroke='#c6ba9e'; pa.style.strokeDashoffset='0';
    }
  });
  const s=F.steps[i];
  const nar=F.root.querySelector('.nar-txt'); if(nar) nar.textContent=s.note||s.label;
  const pos=F.root.querySelector('.flow-pos'); if(pos) pos.textContent=`step ${i+1} / ${F.steps.length}`;
  if(F.codeSheet){
    $$('.cl',F.codeSheet).forEach(cl=>cl.classList.remove('hot'));
    if(s.lines){
      for(let ln=s.lines[0];ln<=s.lines[1];ln++){
        const el=F.codeSheet.querySelector(`.cl[data-line="${ln}"]`);
        if(el) el.classList.add('hot');
      }
    }
    const hot=$('.cl.hot',F.codeSheet);
    if(hot) hot.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  try{ F.chips[i].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}); }catch(e){}
}
function mountTry(p,ai){
  const box=document.querySelectorAll('.try')[ai]; if(!box) return;
  const sel=box.querySelector('.try-sel'), ta=box.querySelector('.try-json'),
        out=box.querySelector('.try-out'), run=box.querySelector('.try-run');
  sel.innerHTML=p.tests.map((t,i)=>`<option value="${i}">${esc(t.label||('test '+(i+1)))}</option>`).join('')+
    `<option value="custom">custom input…</option>`;
  sel.addEventListener('change',()=>{
    const custom=sel.value==='custom';
    ta.hidden=!custom;
    if(custom&&!ta.value.trim()) ta.value=JSON.stringify(p.tests[0]?p.tests[0].input:{},null,1);
  });
  run.addEventListener('click',async()=>{
    out.hidden=false;
    out.innerHTML=`<span class="runmsg">${p.lang==='py'? pyLoadMsg() : 'running…'}</span>`;
    let input;
    if(sel.value==='custom'){
      try{ input=JSON.parse(ta.value); }
      catch(e){ out.innerHTML='<span class="err">custom input isn’t valid JSON</span>'; return; }
    } else input=p.tests[+sel.value].input;
    const a=p.approaches[ai];
    const r=await runCode(a.code,input,p.lang);
    if(r.timeout){ out.innerHTML=`<span class="err">${p.lang==='py'?'timed out (60s) — the Python runtime was reset':'timed out after 3s'} — is there an infinite loop?</span>`; return; }
    let h='';
    if(r.err) h+=`<span class="err">error: ${esc(r.err)}</span>`;
    else{
      const res=fmtVal(r.result);
      if(sel.value!=='custom'){
        const t=p.tests[+sel.value];
        const ok=deepEqual(r.result,t.expected);
        h+= ok? `<div class="vline ok"><i data-lucide="check"></i>returns ${esc(res)} — matches, ${r.ms}ms</div>`
              : `<div class="vline bad"><i data-lucide="x"></i>returns ${esc(res)} — expected ${esc(fmtVal(t.expected))}</div>`;
      } else h+=`<div class="vline ok2">returned ${esc(res)} in ${r.ms}ms</div>`;
    }
    if(r.logs&&r.logs.length) h+=`<div class="logs">${r.logs.map(l=>`<div class="logln">${esc(l)}</div>`).join('')}</div>`;
    out.innerHTML=h; icons();
  });
}
function mountAttempts(p){
  if(!p.attempts.length) return;
  const a=$('#diff-a'), b=$('#diff-b'); if(!a||!b) return;
  a.value=String(Math.max(0,p.attempts.length-2));
  b.value=String(p.attempts.length-1);
  const upd=()=>renderDiffView(p,+a.value,+b.value);
  a.addEventListener('change',upd); b.addEventListener('change',upd);
  upd();
}
function renderDiffView(p,ai,bi){
  const host=$('#diff-view'); if(!host) return;
  if(p.attempts.length<2){ host.innerHTML='<p class="marg sm">one attempt on record — the diff starts at solve #2.</p>'; return; }
  if(ai===bi){ host.innerHTML='<p class="marg sm">pick two different attempts to compare.</p>'; return; }
  if(ai>bi){ const t=ai; ai=bi; bi=t; }
  const A=p.attempts[ai], B=p.attempts[bi];
  const d=diffHTML(A.code,B.code);
  host.innerHTML=`
    <p class="dstat">${esc(d.stat)} — attempt #${ai+1} → attempt #${bi+1}</p>
    <p class="dsub">${fmtAgo(A.ts)} (${fmtDur(A.duration)}) → ${fmtAgo(B.ts)} (${fmtDur(B.duration)})</p>
    ${d.html}`;
}

/* ---------- scratchpad ---------- */
function mountPad(p){
  const host=$('#pad'); if(!host) return;
  const cv=host.querySelector('canvas'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const dpr=Math.max(1, window.devicePixelRatio||1);
  const cw=1200, ch=600;
  cv.width=cw*dpr; cv.height=ch*dpr;
  ctx.scale(dpr,dpr);

  const st={tool:'ink',drawing:false,pts:[],snap:[]};
  if(p.sketch){
    const im=new Image();
    im.onload=()=>{
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(im,0,0,cv.width,cv.height);
      ctx.restore();
    };
    im.src=p.sketch;
  }
  $$('.tool[data-tool]',host).forEach(b=>b.addEventListener('click',()=>{
    st.tool=b.dataset.tool;
    $$('.tool[data-tool]',host).forEach(x=>x.classList.toggle('on',x===b));
  }));
  const clearBtn=host.querySelector('[data-pad-act="clear"]');
  clearBtn&&clearBtn.addEventListener('click',()=>modal({
    title:'clear the scratchpad?',
    body:'the doodles on this page will be wiped.',
    actions:[{label:'keep them',ghost:true},{label:'wipe it',danger:true,icon:'trash-2',fn:()=>{
      pushSnap();
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.restore();
      savePad();
    }}]
  }));
  const undoBtn=host.querySelector('[data-pad-act="undo"]');
  undoBtn&&undoBtn.addEventListener('click',undoPad);
  function pos(e){
    const r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)*cw/r.width, y:(e.clientY-r.top)*ch/r.height};
  }
  function conf(){
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(st.tool==='erase'){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=30; ctx.strokeStyle='rgba(0,0,0,1)'; }
    else if(st.tool==='hl'){ ctx.globalCompositeOperation='multiply'; ctx.strokeStyle='rgba(246,223,107,.45)'; ctx.lineWidth=18; }
    else if(st.tool==='red'){ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=brand.ink||'#c2402a'; ctx.lineWidth=2.8; }
    else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle='#241e17'; ctx.lineWidth=2.6; }
  }
  function pushSnap(){ try{ st.snap.push(cv.toDataURL()); if(st.snap.length>15) st.snap.shift(); }catch(e){} }
  function undoPad(){
    ctx.globalCompositeOperation='source-over';
    const d=st.snap.pop();
    if(!d){
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.restore();
      savePad(); return;
    }
    const im=new Image();
    im.onload=()=>{
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.drawImage(im,0,0,cv.width,cv.height);
      ctx.restore();
      savePad();
    };
    im.src=d;
  }
  let saveT=null;
  function savePad(){ clearTimeout(saveT);
    saveT=setTimeout(()=>{ try{ p.sketch=cv.toDataURL('image/png'); store.save(); }catch(e){} },500); }
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId);
    st.drawing=true; pushSnap();
    const pt=pos(e);
    st.pts=[pt];
    conf();
    ctx.beginPath(); ctx.arc(pt.x,pt.y,ctx.lineWidth/2,0,Math.PI*2); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
  });
  cv.addEventListener('pointermove',e=>{
    if(!st.drawing) return;
    const pt=pos(e);
    st.pts.push(pt);
    conf();
    if(st.pts.length > 2){
      const lastTwo = st.pts.slice(-3);
      const xc = (lastTwo[1].x + lastTwo[2].x) / 2;
      const yc = (lastTwo[1].y + lastTwo[2].y) / 2;
      ctx.beginPath();
      ctx.moveTo(lastTwo[0].x, lastTwo[0].y);
      ctx.quadraticCurveTo(lastTwo[1].x, lastTwo[1].y, xc, yc);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(st.pts[0].x, st.pts[0].y);
      ctx.lineTo(pt.x, pt.y);
      ctx.stroke();
    }
  });
  const up=()=>{ if(!st.drawing) return; st.drawing=false; st.pts=[]; savePad(); };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
}

function improveNote(prev,cur){
  if(!prev) return 'first solve logged — this becomes the baseline every future attempt gets diffed against.';
  const dl=prev.lines-cur.lines, dt=prev.duration-cur.duration;
  const bits=[];
  if(dt>5) bits.push(fmtDur(dt)+' faster'); else if(dt<-5) bits.push(fmtDur(-dt)+' slower');
  if(dl>0) bits.push(dl+' fewer line'+(dl!==1?'s':'')); else if(dl<0) bits.push((-dl)+' more line'+(dl!==1?'s':''));
  if(!bits.length) return `solved in ${fmtDur(cur.duration)} — same pace, same shape. steady hands.`;
  const tone=(dt>5?1:dt<-5?-1:0)+(dl>0?1:dl<0?-1:0);
  let s=`solved in ${fmtDur(cur.duration)} — ${bits.join(', ')}`;
  if(tone>0) s+=' — you’re sharpening up.';
  else if(tone<0) s+=' — peek at the diff below to see what drifted.';
  else s+='.';
  return s;
}

function mountEditor(){
  const ta=$('#ed-ta'); if(!ta) return;
  const p=store.byId(session.pid);
  const lang=p? (p.lang||'js'):'js';
  const code=$('#ed-code'), gut=$('#ed-gut'), pre=$('#ed-hl');
  ta.value=session.code;
  const paint=()=>{
    code.innerHTML=hl(ta.value,lang)+'\n';
    const n=ta.value.split('\n').length;
    gut.innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');
  };
  paint();
  ta.addEventListener('input',()=>{ paint(); session.code=ta.value; });
  const syncScroll=()=>{
    pre.scrollTop=ta.scrollTop; pre.scrollLeft=ta.scrollLeft;
    gut.scrollTop=ta.scrollTop;
  };
  ta.addEventListener('scroll',syncScroll);
  ta.addEventListener('keydown',e=>{
    const tabStr = lang==='py' ? '    ' : '  ';
    const tabLen = tabStr.length;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const val = ta.value;

    if(e.key==='Tab'){
      e.preventDefault();
      if(start!==end){
        const lineStart = val.lastIndexOf('\n', start - 1) + 1;
        const lineEnd = val.indexOf('\n', end);
        const selBlock = val.slice(lineStart, lineEnd===-1 ? val.length : lineEnd);
        const lines = selBlock.split('\n');
        if(e.shiftKey){
          const newLines = lines.map(l => l.startsWith(tabStr) ? l.slice(tabLen) : l.replace(/^\s{1,2}/, ''));
          const newText = newLines.join('\n');
          ta.setRangeText(newText, lineStart, lineEnd===-1 ? val.length : lineEnd, 'select');
        } else {
          const newLines = lines.map(l => tabStr + l);
          const newText = newLines.join('\n');
          ta.setRangeText(newText, lineStart, lineEnd===-1 ? val.length : lineEnd, 'select');
        }
      } else {
        if(e.shiftKey){
          const lineStart = val.lastIndexOf('\n', start - 1) + 1;
          const curLine = val.slice(lineStart, start);
          if(curLine.endsWith(tabStr)){
            ta.setRangeText('', start - tabLen, start, 'end');
          } else if(curLine.endsWith(' ')){
            ta.setRangeText('', start - 1, start, 'end');
          }
        } else {
          ta.setRangeText(tabStr, start, end, 'end');
        }
      }
      paint(); session.code=ta.value;
      return;
    }

    if(e.key==='Enter'){
      e.preventDefault();
      const lineStart = val.lastIndexOf('\n', start - 1) + 1;
      const curLine = val.slice(lineStart, start);
      const matchIndent = curLine.match(/^\s*/)[0];
      let extra = '';
      const trimmed = curLine.trimEnd();
      if(lang==='py' && trimmed.endsWith(':')){
        extra = '    ';
      } else if(lang==='js' && (trimmed.endsWith('{') || trimmed.endsWith('(') || trimmed.endsWith('['))){
        extra = '  ';
      }
      const insertText = '\n' + matchIndent + extra;
      ta.setRangeText(insertText, start, end, 'end');
      paint(); session.code=ta.value;
      return;
    }

    const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
    if(pairs[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey){
      if(start!==end){
        e.preventDefault();
        const sel = val.slice(start, end);
        ta.setRangeText(e.key + sel + pairs[e.key], start, end, 'select');
        paint(); session.code=ta.value;
        return;
      }
      const nextChar = val[start];
      if(e.key===nextChar && [')', ']', '}', '"', "'", '`'].includes(e.key)){
        e.preventDefault();
        ta.selectionStart = ta.selectionEnd = start + 1;
        return;
      }
      if(!['"', "'", '`'].includes(e.key) || !nextChar || /\s/.test(nextChar)){
        e.preventDefault();
        ta.setRangeText(e.key + pairs[e.key], start, start, 'end');
        ta.selectionStart = ta.selectionEnd = start + 1;
        paint(); session.code=ta.value;
        return;
      }
    }

    if(e.key==='Backspace' && start===end && start>0){
      const prevChar = val[start - 1];
      const nextChar = val[start];
      if(prevChar && pairs[prevChar]===nextChar){
        e.preventDefault();
        ta.setRangeText('', start - 1, start + 1, 'end');
        paint(); session.code=ta.value;
        return;
      }
    }
  });
}
async function runTests(){
  if(!session||session.done) return;
  const ta=$('#ed-ta'); if(ta) session.code=ta.value;
  const p=store.byId(session.pid); if(!p) return;
  const out=$('#tres');
  out.innerHTML=`<p class="runmsg">${p.lang==='py'? pyLoadMsg() : `running against ${p.tests.length} test${p.tests.length!==1?'s':''}…`}</p>`;
  const rows=[]; let all=true;
  for(const t of p.tests){
    const r=await runCode(session.code,t.input,p.lang);
    let ok=false;
    if(r.timeout||r.err){ ok=false; }
    else ok=deepEqual(r.result,t.expected);
    if(!ok) all=false;
    rows.push({t,r,ok});
  }
  out.innerHTML=rows.map(o=>{
    const {t,r,ok}=o;
    let right;
    if(r.timeout) right=`<span class="tr-exp">${p.lang==='py'?'timed out (60s) — runtime reset':'timed out (3s)'}</span>`;
    else if(r.err) right=`<span class="tr-exp">error: ${esc(r.err)}</span>`;
    else right=`<span class="tr-got">got ${esc(fmtVal(r.result))}</span>${ok?'':`<span class="tr-exp">expected ${esc(fmtVal(t.expected))}</span>`}<span class="tr-ms">${r.ms??'—'}ms</span>`;
    return `<div class="tr-row ${ok?'ok':'no'}"><i data-lucide="${ok?'check':'x'}"></i><span class="tr-l">${esc(t.label||fmtVal(t.input))}</span>${right}</div>`;
  }).join('')+(all?'':`<p class="marg sm">not quite — ${rows.filter(r=>r.ok).length} of ${rows.length} passing. keep iterating.</p>`);
  icons();
  if(all) passSession();
}
function passSession(){
  if(session.done) return;
  session.done=true;
  clearInterval(tickId);
  const p=store.byId(session.pid);
  const duration=Math.max(1,Math.round((Date.now()-session.start)/1000));
  const attempt={ts:Date.now(),duration,passed:true,revealed:session.revealed,
    lines:session.code.split('\n').length,code:session.code};
  p.attempts.push(attempt);
  store.save();
  render();
  toast('solved — attempt #'+p.attempts.length+' saved','check');
}

  return `<div class="rep rep-ap">
    <div class="rep-head"><span class="rep-tag">approach ${ai+1}</span><span class="flex1"></span>
      <button class="rep-del" title="remove" onclick="formDelAp(${ai})"><i data-lucide="x"></i></button></div>
    <div class="f-row3">
      ${fField('name','a-name',a.name,'hash set')}
      ${fField('time','a-time',a.time,'O(n)')}
      ${fField('space','a-space',a.space,'O(n)')}
    </div>
    ${fTa('the idea','a-idea',a.idea, py?'walk the array once, remember what you’ve seen…':'walk the array once, remember what you’ve seen…',3)}
    ${fTa('code (runs with input in scope; return the answer)','a-code',a.code, py?'seen = set()':'const seen = new Set();',9,'code')}
    <div class="rep-steps">
      <div class="steps-lbl">
        <label class="f-lbl" style="margin:0">flow steps — the walkthrough arrows</label>
        <button class="btn ghost xs" onclick="formAddStep(${ai})"><i data-lucide="plus"></i>step</button>
      </div>
      ${a.steps.length? `<div class="step-legend"><span>step</span><span>walkthrough note</span><span>code lines</span><span>branches (optional)</span><span></span></div>
      ${a.steps.map((s,si)=>stepRep(ai,si,s)).join('')}`:'<p class="marg sm" style="margin:6px 0">no steps — this approach will show without a walkthrough.</p>'}
    </div>
  </div>`;
}
function stepRep(ai,si,s){
  return `<div class="step-rep">
    <span class="step-idx">${si+1}</span>
    <input class="fin sm" data-f="s-label" value="${esc(s.label)}" placeholder="create a set">
    <input class="fin sm" data-f="s-note" value="${esc(s.note)}" placeholder="what happens here…">
    <div class="f-lns">
      <input class="fin xs num" data-f="s-from" value="${esc(s.from)}" placeholder="L1" title="code line from">
      <input class="fin xs num" data-f="s-to" value="${esc(s.to)}" placeholder="L2" title="code line to">
    </div>
    <div class="f-br2">
      <input class="fin xs" data-f="s-yes" value="${esc(s.yes)}" placeholder="if yes →" title="yes branch">
      <input class="fin xs" data-f="s-no" value="${esc(s.no)}" placeholder="if no →" title="no branch">
    </div>
    <button class="rep-del" title="remove" onclick="formDelStep(${ai},${si})"><i data-lucide="x"></i></button>
  </div>`;
}
function dv(name,root=document){ const el=root.querySelector(`[data-f="${name}"]`); return el? el.value:''; }
function harvest(){
  draft.title=dv('f-title'); draft.difficulty=dv('f-diff');
  draft.lang = dv('f-lang')==='Python'?'py':'js';
  draft.tagsStr=dv('f-tags');
  draft.statement=dv('f-statement'); draft.given=dv('f-given'); draft.ret=dv('f-return');
  draft.summary=dv('f-summary'); draft.starter=dv('f-starter');
  draft.tests=$$('.rep-tests .rep-item').map(el=>({label:dv('t-label',el),inputStr:dv('t-input',el),expectedStr:dv('t-expected',el)}));
  draft.approaches=$$('.rep-approaches .rep-ap').map(el=>({
    name:dv('a-name',el),time:dv('a-time',el),space:dv('a-space',el),
    idea:dv('a-idea',el),code:dv('a-code',el),
    steps:$$('.rep-steps .step-rep',el).map(s=>({label:dv('s-label',s),note:dv('s-note',s),
      from:dv('s-from',s),to:dv('s-to',s),yes:dv('s-yes',s),no:dv('s-no',s)}))
  }));
}
function formAddTest(){ harvest(); draft.tests.push({label:'',inputStr:'',expectedStr:''}); render(); }
function formDelTest(i){ harvest(); draft.tests.splice(i,1); render(); }
function formAddAp(){ harvest(); draft.approaches.push({name:'',time:'',space:'',idea:'',code:'',steps:[]}); render(); }
function formDelAp(i){ harvest(); draft.approaches.splice(i,1); render(); }
function formAddStep(ai){ harvest(); draft.approaches[ai].steps.push({label:'',note:'',from:'',to:'',yes:'',no:''}); render(); }
function formDelStep(ai,si){ harvest(); draft.approaches[ai].steps.splice(si,1); render(); }
function formSave(){
  harvest();
  const errs=[];
  if(!draft.title.trim()) errs.push('a title, at the very least');
  if(!draft.statement.trim()) errs.push('the question statement');
  if(!draft.tests.length) errs.push('at least one test');
  const tests=[];
  draft.tests.forEach((t,i)=>{
    let input,expected;
    try{ input=JSON.parse(t.inputStr); }catch(e){ errs.push(`test ${i+1}: input isn’t valid JSON`); return; }
    try{ expected=JSON.parse(t.expectedStr); }catch(e){ errs.push(`test ${i+1}: expected isn’t valid JSON`); return; }
    if(typeof input!=='object'||input===null||Array.isArray(input))
      errs.push(`test ${i+1}: input should be a JSON object, like {"nums":[1,2,3,1]}`);
    tests.push({label:t.label.trim()||fmtVal(input),input,expected});
  });
  if(errs.length){
    $('#f-errs').innerHTML=`<div class="ferrbox"><i data-lucide="pencil"></i><span>${errs.map(esc).join('<br>')}</span></div>`;
    icons(); toast('a few gaps to fill in','pencil');
    return;
  }
  const approaches=draft.approaches.map((a,i)=>{
    const steps=a.steps.map(s=>{
      let lines=null;
      const f=String(s.from).trim(), t=String(s.to).trim();
      if(f!==''||t!==''){
        const from=Math.max(1,parseInt(f)||1);
        const to=Math.max(from,parseInt(t)||from);
        lines=[from,to];
      }
      return {label:s.label.trim(),note:s.note.trim(),lines,yes:s.yes.trim(),no:s.no.trim()};
    }).filter(s=>s.label);
    return { name:a.name.trim()||('approach '+(i+1)), time:a.time.trim(), space:a.space.trim(),
             idea:a.idea.trim(), code:a.code, steps };
  });
  const p={ id:draft.id, title:draft.title.trim(), difficulty:draft.difficulty, lang:draft.lang,
    tags:draft.tagsStr.split(',').map(t=>t.trim()).filter(Boolean),
    statement:draft.statement.trim(), given:draft.given.trim(), ret:draft.ret.trim(),
    summary:draft.summary.trim(), starter:draft.starter.trim(),
    tests, approaches, attempts:draft.attempts||[], sketch:draft.sketch||null,
    createdAt:draft.createdAt||Date.now() };
  store.upsert(p); store.save();
  toast('page saved to the notebook','check');
  go('#p/'+p.id);
}

/* ---------- delete ---------- */
function askDelete(id){
  const p=store.byId(id); if(!p) return;
  modal({
    title:'tear out this page?',
    body:`“${esc(p.title)}” and its ${p.attempts.length} logged attempt${p.attempts.length!==1?'s':''} will be gone for good.`,
    actions:[
      {label:'keep it',ghost:true},
      {label:'tear it out',danger:true,icon:'trash-2',fn:()=>{
        store.remove(id); store.save();
        toast('page removed','trash-2');
        if(ui.view==='problem'&&ui.pid===id) go('#library'); else render();
      }}
    ]
  });
}

/* ---------- customize (the settings modal) ---------- */
function openSettings(){
  const w=document.createElement('div');
  w.className='mo-wrap';
  w.innerHTML=`<div class="mo mo-set">
    <h3>make it yours</h3>
    <p>the name on the cover, the line under it, and the ink it’s written in.</p>
    <label class="f-lbl" for="set-name">notebook name</label>
    <input class="fin" id="set-name" maxlength="42" value="${esc(brand.name)}" autocomplete="off" placeholder="Margin Notes">
    <label class="f-lbl" for="set-tag">tagline</label>
    <input class="fin" id="set-tag" maxlength="96" value="${esc(brand.tag)}" autocomplete="off" placeholder="a line under the title…">
    <label class="f-lbl">ink</label>
    <div class="set-inks">${INKS.map(([c,n])=>`<button class="set-ink${c===brand.ink?' on':''}" data-ink="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')}</div>
    <div class="set-zone">
      <button class="btn ghost xs" id="set-clear"><i data-lucide="trash-2"></i>clear every page</button>
      <button class="btn ghost xs" id="set-restore"><i data-lucide="rotate-ccw"></i>restore sample pages</button>
    </div>
    <div class="mo-actions">
      <button class="btn ghost" id="set-cancel">cancel</button>
      <button class="btn" id="set-save"><i data-lucide="check"></i>save</button>
    </div>
  </div>`;
  document.body.appendChild(w); icons();
  let ink=brand.ink;
  $$('.set-ink',w).forEach(b=>b.addEventListener('click',()=>{
    ink=b.dataset.ink;
    $$('.set-ink',w).forEach(x=>x.classList.toggle('on',x===b));
  }));
  const close=()=>w.remove();
  w.addEventListener('click',e=>{ if(e.target===w) close(); });
  $('#set-cancel',w).addEventListener('click',close);
  $('#set-save',w).addEventListener('click',()=>{
    brand.name=$('#set-name',w).value.trim()||'Margin Notes';
    brand.tag=$('#set-tag',w).value.trim();
    brand.ink=ink;
    saveBrand(); applyBrand(); close();
    render(); toast('notebook updated','check');
  });
  $('#set-clear',w).addEventListener('click',()=>{ close(); modal({
    title:'clear every page?',
    body:'every problem, attempt and doodle goes — the cover stays yours.',
    actions:[
      {label:'keep them',ghost:true},
      {label:'clear it all',danger:true,icon:'trash-2',fn:()=>{
        store.problems=[]; store.save(); session=null;
        toast('notebook emptied','trash-2'); go('#library');
      }}
    ]
  }); });
  $('#set-restore',w).addEventListener('click',()=>{ close(); modal({
    title:'restore the sample pages?',
    body:'replaces whatever is in the notebook with the original three sample pages.',
    actions:[
      {label:'keep mine',ghost:true},
      {label:'restore samples',icon:'rotate-ccw',fn:()=>{
        localStorage.removeItem(LS_KEY);
        store.problems=seed(); store.save(); session=null;
        toast('samples restored','rotate-ccw'); go('#library');
      }}
    ]
  }); });
}

/* ---------- toast & modal ---------- */
function toast(msg,icon='check'){
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<i data-lucide="${icon}"></i><span>${esc(msg)}</span>`;
  document.body.appendChild(t); icons();
  requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{ t.classList.remove('on'); setTimeout(()=>t.remove(),350); },2400);
}
function modal(opts){
  const w=document.createElement('div');
  w.className='mo-wrap';
  w.innerHTML=`<div class="mo"><h3>${esc(opts.title)}</h3><p>${opts.body}</p><div class="mo-actions"></div></div>`;
  const act=$('.mo-actions',w);
  opts.actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn'+(a.ghost?' ghost':'')+(a.danger?' red':'');
    b.innerHTML=`${a.icon?`<i data-lucide="${a.icon}"></i>`:''}<span>${esc(a.label)}</span>`;
    b.addEventListener('click',()=>{ w.remove(); a.fn&&a.fn(); });
    act.appendChild(b);
  });
  document.body.appendChild(w); icons();
}

/* ---------- boot ---------- */
loadBrand(); applyBrand();
store.load();
route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitSquiggles());
</script>
